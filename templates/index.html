<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SYNOP / METAR Argentina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">WX</span>
      <span class="brand-sub">Argentina · SYNOP / METAR</span>
    </div>
    <div class="controls">
      <div class="product-toggle" role="group" aria-label="Producto">
        <button type="button" class="btn product-btn active" data-product="synop" id="btnProductSynop">SYNOP</button>
        <button type="button" class="btn product-btn" data-product="metar" id="btnProductMetar">METAR</button>
      </div>
      <label class="field">
        <span>Hora UTC</span>
        <input type="datetime-local" id="hourInput" step="3600" />
      </label>
      <button type="button" id="btnLoad" class="btn primary">Actualizar</button>
      <button type="button" id="btnConfig" class="btn ghost" aria-expanded="false" aria-controls="configPanel">Configuración</button>
      <label class="check" id="nilWrap">
        <input type="checkbox" id="chkNil" />
        Incluir NIL
      </label>
    </div>
    <div class="status" id="status">Cargando…</div>
  </header>

  <aside id="configPanel" class="config-panel hidden" aria-label="Configuración">
    <div class="config-head">
      <h2>Configuración</h2>
      <button type="button" class="detail-close" id="configClose" aria-label="Cerrar">×</button>
    </div>

    <label class="config-row check">
      <input type="checkbox" id="cfgAutorefresh" />
      <span>Autorefresh cada 2 minutos</span>
    </label>

    <fieldset class="config-fieldset">
      <legend>Timeline</legend>
      <label class="config-row radio">
        <input type="radio" name="timeline" id="cfgTimelineExact" value="exact" checked />
        <span>
          <strong>Solo hora seleccionada</strong>
          <small>Oculta estaciones sin dato en esa hora</small>
        </span>
      </label>
      <label class="config-row radio">
        <input type="radio" name="timeline" id="cfgTimelineLatest" value="latest" />
        <span>
          <strong>Último dato disponible</strong>
          <small>Muestra el reporte más reciente de cada estación (hasta 24 h atrás)</small>
        </span>
      </label>
    </fieldset>

    <fieldset class="config-fieldset">
      <legend>FIR</legend>
      <label class="config-row check">
        <input type="checkbox" id="cfgFirAll" checked />
        <span>Todas las FIR</span>
      </label>
      <div class="fir-checks" id="firChecks">
        <label class="config-row check"><input type="checkbox" value="EZE" checked /> <span><strong>EZE</strong> Ezeiza</span></label>
        <label class="config-row check"><input type="checkbox" value="CBA" checked /> <span><strong>CBA</strong> Córdoba</span></label>
        <label class="config-row check"><input type="checkbox" value="DOZ" checked /> <span><strong>DOZ</strong> Mendoza</span></label>
        <label class="config-row check"><input type="checkbox" value="SIS" checked /> <span><strong>SIS</strong> Resistencia</span></label>
        <label class="config-row check"><input type="checkbox" value="CRV" checked /> <span><strong>CRV</strong> Comodoro Rivadavia</span></label>
      </div>
      <small>Filtra estaciones según la FIR de su ubicación</small>
    </fieldset>

    <label class="config-row field">
      <span>Separación de símbolos <em id="cfgGapLabel">0.75</em></span>
      <input type="range" id="cfgPlotGap" min="0.55" max="1.15" step="0.05" value="0.75" />
      <small>Acerca o aleja los símbolos del punto de la estación (sin cambiar el tamaño)</small>
    </label>
  </aside>

  <main id="map"></main>
  <div id="fltLegend" class="flt-legend-wrap hidden"></div>

  <aside id="detail" class="detail hidden" aria-live="polite">
    <button type="button" class="detail-close" id="detailClose" aria-label="Cerrar">×</button>
    <div id="detailBody"></div>
  </aside>

  <div id="tsModal" class="ts-modal hidden" role="dialog" aria-modal="true" aria-labelledby="tsTitle">
    <div class="ts-modal-card">
      <div class="ts-modal-head">
        <div>
          <h2 id="tsTitle">Serie temporal</h2>
          <div class="ts-modal-sub" id="tsSubtitle"></div>
        </div>
        <button type="button" class="detail-close" id="tsClose" aria-label="Cerrar">×</button>
      </div>
      <div class="ts-modal-body" id="tsBody"></div>
    </div>
  </div>

  <div id="hoverTip" class="hover-tip hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/symbols.js"></script>
  <script src="/static/js/ww.js"></script>
  <script src="/static/js/station-plot.js"></script>
  <script src="/static/js/timeseries.js"></script>
  <script src="/static/js/metar.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
