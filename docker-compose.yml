services:
  synop:
    build: .
    # Misma pila de red que el host: así el contenedor ve las rutas de la VPN
    # (10.10.100.121). Con bridge Docker, tras (re)conectar VPN suele fallar
    # con "No route to host" aunque DBeaver en el host sí conecte.
    network_mode: host
    environment:
      PORT: ${PORT:-8080}
      DMA_MYSQL_HOST: ${DMA_MYSQL_HOST:-10.10.100.121}
      DMA_MYSQL_PORT: ${DMA_MYSQL_PORT:-3306}
      DMA_MYSQL_USER: ${DMA_MYSQL_USER:-}
      DMA_MYSQL_PASSWORD: ${DMA_MYSQL_PASSWORD:-}
      DMA_MYSQL_DATABASE: ${DMA_MYSQL_DATABASE:-mensajes}
      DMA_MYSQL_SSL: ${DMA_MYSQL_SSL:-0}
    restart: unless-stopped
